# Sample GitHub Actions workflow: invoke the SNS Email Aide via OIDC.
# See README.md in this folder for the one-time AWS setup this depends on.
name: sns-email-aide-example

on:
  workflow_dispatch:

permissions:
  id-token: write        # required for OIDC
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SNS_EMAIL_AIDE_FUNCTION: sns-email-aide-interface
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<account-id>:role/<github-oidc-role>
          aws-region: ${{ env.AWS_REGION }}

      - name: Register a test address
        run: |
          aws lambda invoke --function-name "$SNS_EMAIL_AIDE_FUNCTION" \
            --payload '{"action":"register","email":"ci-run@testing.example.com","expectations":{"body-contains-all":"welcome"}}' \
            --cli-binary-format raw-in-base64-out out.json
          cat out.json
