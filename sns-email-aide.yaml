# SPDX-License-Identifier: MIT-0
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SNS email aide - auto-confirms SNS email subscriptions and validates
  notification content so integration test runs need no human interaction.
  Deploy-once test-support infrastructure, invoked directly via
  lambda:InvokeFunction.

Parameters:
  EmailDomain:
    Type: String
    AllowedPattern: '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$'
    ConstraintDescription: >
      Must be a bare domain (e.g. testing.example.com), not an email address.
    Description: >
      The email domain (really a sub-domain) this aide receives on via SES inbound. A bare domain, not
      an address: the aide accepts registrations for any local-part under it
      (e.g. <id>@<domain>). The domain's MX records must route to SES
      in this region which means this domain should be used exclusively with the aide. 
      Supplied by the operator; the aide has no dependency on any consuming application.

  RecordTtlSeconds:
    Type: Number
    Default: 7200
    MinValue: 60
    Description: >
      TTL in seconds for records. Registration/confirmation/validation rows for
      an email share the registration's expiry; unexpected rows (mail to an
      unregistered address) expire independently after this many seconds.

Resources:
  # --- DynamoDB ---
  # Audit trail of registration/confirmation/validation events. TableName is
  # omitted so CloudFormation auto-generates it; Lambdas discover it via the
  # TABLE_NAME env var (!Ref), so nothing depends on a fixed name.
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: event
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
        - AttributeName: event
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- S3 Bucket for SES inbound mail ---
  # No DeletionPolicy: stack delete fails loudly if the bucket is non-empty, so
  # the operator explicitly clears leftover mail rather than orphaning a bucket.
  # The lifecycle rule self-empties within ~1 day (S3's minimum expiration
  # granularity), so a teardown after mail has aged out just works.
  MailBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: expire-transient-mail
            Status: Enabled
            ExpirationInDays: 1

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${MailBucket.Arn}/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId

  # --- IAM Roles ---
  InterfaceLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDB
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                Resource: !GetAtt EventsTable.Arn

  ProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDB
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                Resource: !GetAtt EventsTable.Arn
        - PolicyName: SNSConfirm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:ConfirmSubscription
                # Topics are created per test run, so the specific ARN isn't
                # known here; scope to any SNS topic in this account.
                Resource: !Sub "arn:${AWS::Partition}:sns:*:${AWS::AccountId}:*"
        - PolicyName: S3Mail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/*"

  # --- Lambda Functions ---
  # Interface Lambda is invoked directly (lambda:InvokeFunction) with an
  # action envelope:
  #   {"action":"register","email":...,"validation":[{"body-contains":...}]}
  #   {"action":"status","email":...}    -> derived overall status
  #   {"action":"history","email":...}   -> full audit trail
  #   {"action":"delete","email":...}    -> remove all rows for the address
  # Named off the stack so callers can invoke by a stable, derivable name.
  InterfaceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-interface"
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt InterfaceLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref EventsTable
          RECORD_TTL_SECONDS: !Ref RecordTtlSeconds
          EMAIL_DOMAIN: !Ref EmailDomain
      Code:
        ZipFile: |
          # SPDX-License-Identifier: MIT-0
          """Interface Lambda - direct-invoke handler.

          Invoked via lambda:InvokeFunction (no HTTP/Function URL). Actions:

            register: {"action": "register", "email": "...", "expectations": {...}}
            status:   {"action": "status", "email": "..."}     -> derived overall status
            history:  {"action": "history", "email": "..."}     -> full audit trail
            delete:   {"action": "delete", "email": "..."}      -> remove all rows

          `expectations` (all keys optional; keys are AND'd) constrain what the processor
          will act on / accept:
            sns-topic-name | sns-topic-arn | sns-topic-like   (topic identity)
            account-ids                                        (list of allowed accounts)
            subject-matches | subject-like |
              subject-contains-any | subject-contains-all      (notification subject)
            body-contains-any | body-contains-all |
              body-like-any | body-like-all                    (notification body)
          Values are a string or a list; `-any` = OR across the list, `-all` = AND.

          The table is an append-only audit trail keyed (email [PK], event [SK]):
            registration            registration facts + expectations
            confirmation#<epoch>     result success | mismatch | error
            notification#<epoch>     result success | failure | mismatch | unregistered
            unexpected#<epoch>       result undefined | unregistered (recorded, not acted on)

          Registration/confirmation/notification rows share the registration ttl;
          unexpected rows expire independently.
          """

          import os
          import time
          import logging
          import boto3
          from boto3.dynamodb.conditions import Key

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          dynamodb = boto3.resource('dynamodb')
          TABLE_NAME = os.environ['TABLE_NAME']
          RECORD_TTL_SECONDS = int(os.environ.get('RECORD_TTL_SECONDS', '7200'))
          # The bare domain SES receives on. Registrations must be under it, since mail
          # for any other domain never reaches the aide.
          EMAIL_DOMAIN = os.environ.get('EMAIL_DOMAIN', '').strip().lower()

          REGISTRATION_EVENT = 'registration'
          # Events that represent activity against a registration's expectations; their
          # presence blocks re-registration (the trail was judged against those rules).
          JUDGED_PREFIXES = ('confirmation#', 'notification#')

          VALID_EXPECTATION_KEYS = {
              'sns-topic-name', 'sns-topic-arn', 'sns-topic-like', 'account-ids',
              'subject-matches', 'subject-like', 'subject-contains-any', 'subject-contains-all',
              'body-contains-any', 'body-contains-all', 'body-like-any', 'body-like-all',
          }


          def handler(event, context):
              action = (event or {}).get('action')
              if action == 'register':
                  return _register(event)
              if action == 'status':
                  return _status(event)
              if action == 'history':
                  return _history(event)
              if action == 'delete':
                  return _delete(event)
              raise ValueError(f"unknown or missing action: {action!r}")


          def _register(event):
              email = _require_email(event)
              _require_configured_domain(email)
              expectations = event.get('expectations', {}) or {}
              _validate_expectations(expectations)

              # Registration is allowed while the address has no confirmation/notification
              # events. A prior registration row (not yet exercised) or unexpected events
              # (rogue mail that predates or is independent of registration) do not block;
              # unexpected events are kept. Once judged events exist, they were evaluated
              # against a specific expectations set, so the caller must `delete` to reuse.
              items = _query(email)
              if any(_judged(it) for it in items):
                  raise ValueError(
                      f"{email} already has confirmation/notification events; "
                      f"delete it before re-registering")

              now = int(time.time())
              _table().put_item(Item={
                  'email': email,
                  'event': REGISTRATION_EVENT,
                  'result': 'success',
                  'expectations': expectations,
                  'registeredAt': now,
                  'timestamp': now,
                  'ttl': now + RECORD_TTL_SECONDS,
              })
              logger.info("Registered %s with %d expectation(s)", email, len(expectations))
              return {'email': email, 'status': 'registered', 'registeredAt': now}


          def _validate_expectations(expectations):
              if not isinstance(expectations, dict):
                  raise ValueError("'expectations' must be an object")
              unknown = set(expectations) - VALID_EXPECTATION_KEYS
              if unknown:
                  raise ValueError(f"unknown expectation key(s): {sorted(unknown)}")


          def _status(event):
              email = _require_email(event)
              return {'email': email, 'status': _derive_status(_query(email))}


          def _history(event):
              email = _require_email(event)
              items = _query(email)
              events = [{
                  'event': it['event'],
                  'result': it.get('result'),
                  'timestamp': _to_num(it.get('timestamp')),
                  'sender': it.get('sender'),
                  'subject': it.get('subject'),
                  'body': it.get('body'),
                  'detail': it.get('detail'),
              } for it in items]
              events.sort(key=lambda e: e['timestamp'] or 0)
              return {'email': email, 'status': _derive_status(items), 'events': events}


          def _delete(event):
              email = _require_email(event)
              items = _query(email)
              table = _table()
              with table.batch_writer() as batch:
                  for it in items:
                      batch.delete_item(Key={'email': email, 'event': it['event']})
              logger.info("Deleted %d row(s) for %s", len(items), email)
              return {'email': email, 'deleted': len(items)}


          def _derive_status(items):
              """Overall status:
                not-known       no rows at all
                not-registered  only unexpected events, no registration
                registered      registration (+ zero or more unexpected), no judged events
                <event>/<result>  the latest confirmation/notification event otherwise
              """
              if not items:
                  return 'not-known'
              has_registration = any(it['event'] == REGISTRATION_EVENT for it in items)
              judged = sorted((it for it in items if _judged(it)),
                              key=lambda it: _to_num(it.get('timestamp')) or 0)
              if not has_registration:
                  return 'not-registered'
              if not judged:
                  return 'registered'
              latest = judged[-1]
              kind = latest['event'].split('#', 1)[0]
              return f"{kind}/{latest.get('result')}"


          def _judged(item):
              return item['event'].startswith(JUDGED_PREFIXES)


          def _to_num(value):
              # DynamoDB returns numbers as Decimal; normalize for JSON output.
              if value is None:
                  return None
              return float(value)


          def _require_email(event):
              # Canonicalize to lowercase so the DynamoDB PK is stable: the processor
              # looks up inbound mail by the same lowercased address, and no real mail
              # provider treats local-parts case-sensitively.
              email = (event.get('email') or '').strip().lower()
              if not email:
                  raise ValueError("missing or empty 'email'")
              return email


          def _require_configured_domain(email):
              """Reject a registration whose domain isn't the one SES receives on; mail
              for any other domain would never reach the aide (SES routes only the
              configured domain), so such a registration could never be exercised."""
              if '@' not in email or not email.split('@')[0]:
                  raise ValueError(f"'{email}' is not a valid email address")
              if not EMAIL_DOMAIN:
                  return  # domain not configured for this Lambda; skip the check
              domain = email.rsplit('@', 1)[1].lower()
              if domain != EMAIL_DOMAIN:
                  raise ValueError(
                      f"email domain '{domain}' must be the configured domain '{EMAIL_DOMAIN}'")


          def _query(email):
              """Return all rows for an email, following DynamoDB pagination so a trail
              larger than one 1 MB page is never silently truncated."""
              items = []
              kwargs = {'KeyConditionExpression': Key('email').eq(email)}
              while True:
                  resp = _table().query(**kwargs)
                  items.extend(resp.get('Items', []))
                  start = resp.get('LastEvaluatedKey')
                  if not start:
                      return items
                  kwargs['ExclusiveStartKey'] = start


          def _table():
              return dynamodb.Table(TABLE_NAME)
  ProcessorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-processor"
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt ProcessorLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref EventsTable
          MAIL_BUCKET: !Ref MailBucket
          RECORD_TTL_SECONDS: !Ref RecordTtlSeconds
      Code:
        ZipFile: |
          # SPDX-License-Identifier: MIT-0
          """Email Processor Lambda - SES inbound email handler.

          Triggered by an SES receipt rule (S3 action stores the raw mail, then this
          Lambda runs). Every message is first put through a trust gate; only genuine
          SNS mail for a registered address is acted on.

          Trust gate (from the SES event's receipt object + headers, no body read):
            DKIM PASS and DMARC PASS and the From domain is sns.amazonaws.com.
            Fail -> record an `unexpected`/`undefined` event and stop.

          Confirmation message (subject is a known SNS confirmation subject):
            - unregistered address       -> unexpected/unregistered
            - parse topic/account from the confirmation URL (body is trusted post-gate)
            - topic/account expectations match -> sns:ConfirmSubscription, confirmation/success
            - do not match               -> confirmation/mismatch
            - infrastructure failure      -> confirmation/error

          Notification message (any other subject):
            - unregistered address       -> notification/unregistered
            - parse topic/account from the unsubscribe footer URL; a required
              topic/account expectation that mismatches or can't be parsed
              -> notification/mismatch
            - remaining subject/body expectations pass -> notification/success
            - otherwise                   -> notification/failure

          Registration/confirmation/notification rows share the registration's ttl;
          unexpected rows use the default ttl and expire independently.
          """

          import email as emaillib
          import fnmatch
          import logging
          import os
          import re
          import time
          from decimal import Decimal
          from urllib.parse import urlparse, parse_qs

          import boto3
          from boto3.dynamodb.conditions import Key

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          TABLE_NAME = os.environ['TABLE_NAME']
          MAIL_BUCKET = os.environ.get('MAIL_BUCKET', '')
          RECORD_TTL_SECONDS = int(os.environ.get('RECORD_TTL_SECONDS', '7200'))

          ddb = boto3.resource('dynamodb')
          table = ddb.Table(TABLE_NAME)
          s3 = boto3.client('s3')
          sns_client = boto3.client('sns')

          SNS_FROM_DOMAIN = 'sns.amazonaws.com'
          # Subjects that mark a message as an SNS subscription confirmation. Kept as a
          # list so localized variants can be added.
          CONFIRMATION_SUBJECTS = ['AWS Notification - Subscription Confirmation']

          CONFIRMATION_URL_PATTERN = re.compile(
              r'https://sns\.[a-z0-9-]+\.amazonaws\.com/confirmation\.html\?[^\s"<]+')
          UNSUBSCRIBE_URL_PATTERN = re.compile(
              r'https://sns\.[a-z0-9-]+\.amazonaws\.com/unsubscribe\.html\?[^\s"<]+')

          MAX_BODY = 8000
          MAX_UNEXPECTED_SUBJECT = 20


          def handler(event, context):
              for record in event.get('Records', []):
                  ses = record['ses']
                  mail = ses['mail']
                  receipt = ses.get('receipt', {})
                  message_id = mail['messageId']
                  headers = mail['commonHeaders']
                  recipients = headers.get('to', [])
                  subject = headers.get('subject', '')
                  sender = _extract_email(_first(headers.get('from', [])))

                  genuine = _is_genuine_sns(receipt, sender)
                  logger.info('Event: id=%s from=%s subject=%s genuine=%s to=%s',
                              message_id, sender, subject, genuine, recipients)

                  is_confirmation = subject in CONFIRMATION_SUBJECTS
                  body = None  # read lazily, only when needed for a trusted, registered msg
                  for recipient in recipients:
                      addr = _extract_email(recipient)
                      if not genuine:
                          _unexpected(addr, sender, subject, 'undefined')
                          continue
                      reg = _registration(addr)
                      if not reg:
                          # Genuine SNS mail, but this address was never (or no longer) registered.
                          if is_confirmation:
                              _unexpected(addr, sender, subject, 'unregistered')
                          else:
                              _record(addr, 'notification', 'unregistered', None, subject, '')
                          continue
                      if body is None:
                          body = _get_body(message_id)
                      if is_confirmation:
                          _confirm(addr, reg, subject, body)
                      else:
                          _notify(addr, reg, subject, body)

              return {'statusCode': 200}


          def _is_genuine_sns(receipt, sender):
              dkim = receipt.get('dkimVerdict', {}).get('status')
              dmarc = receipt.get('dmarcVerdict', {}).get('status')
              from_domain = sender.split('@')[-1].lower() if '@' in sender else ''
              return dkim == 'PASS' and dmarc == 'PASS' and from_domain == SNS_FROM_DOMAIN


          # --- Confirmation path ---

          def _confirm(addr, reg, subject, body):
              ttl = reg.get('ttl')
              exp = reg.get('expectations', {}) or {}
              match = CONFIRMATION_URL_PATTERN.search(body)
              if not match:
                  _record(addr, 'confirmation', 'error', ttl, subject, body,
                          detail='no confirmation URL in body')
                  return
              params = parse_qs(urlparse(match.group(0)).query)
              topic_arn = params.get('TopicArn', [None])[0]
              token = params.get('Token', [None])[0]
              if not topic_arn or not token:
                  _record(addr, 'confirmation', 'error', ttl, subject, body,
                          detail='missing TopicArn or Token in confirmation URL')
                  return
              ok, why = _topic_ok(exp, topic_arn)
              if not ok:
                  _record(addr, 'confirmation', 'mismatch', ttl, subject, body,
                          detail=why, topicArn=topic_arn)
                  return
              try:
                  sns_client.confirm_subscription(TopicArn=topic_arn, Token=token)
              except Exception as e:
                  _record(addr, 'confirmation', 'error', ttl, subject, body,
                          detail=f'ConfirmSubscription failed: {e}', topicArn=topic_arn)
                  return
              _record(addr, 'confirmation', 'success', ttl, subject, body, topicArn=topic_arn)
              logger.info('Confirmed subscription for %s', addr)


          # --- Notification path ---

          def _notify(addr, reg, subject, body):
              ttl = reg.get('ttl')
              exp = reg.get('expectations', {}) or {}

              if _has_topic_expectation(exp):
                  topic_arn = _topic_arn_from_footer(body)
                  if topic_arn is None:
                      _record(addr, 'notification', 'mismatch', ttl, subject, body,
                              detail='topic expectation set but no unsubscribe link found')
                      return
                  ok, why = _topic_ok(exp, topic_arn)
                  if not ok:
                      _record(addr, 'notification', 'mismatch', ttl, subject, body,
                              detail=why, topicArn=topic_arn)
                      return

              ok, why = _content_ok(exp, subject, body)
              if ok:
                  _record(addr, 'notification', 'success', ttl, subject, body)
              else:
                  _record(addr, 'notification', 'failure', ttl, subject, body, detail=why)


          def _topic_arn_from_footer(body):
              m = UNSUBSCRIBE_URL_PATTERN.search(body)
              if not m:
                  return None
              arn = parse_qs(urlparse(m.group(0)).query).get('SubscriptionArn', [None])[0]
              if not arn:
                  return None
              # SubscriptionArn = <topic-arn>:<sub-id>; drop the trailing subscription id.
              return arn.rsplit(':', 1)[0]


          # --- Expectation matching (keys AND'd; -any=OR, -all=AND; like=glob) ---

          def _has_topic_expectation(exp):
              return any(k in exp for k in ('sns-topic-name', 'sns-topic-arn',
                                            'sns-topic-like', 'account-ids'))


          def _topic_ok(exp, topic_arn):
              """Check topic/account expectations against a parsed topic ARN.

              ARN form: arn:aws:sns:<region>:<account>:<topic-name>
              """
              parts = topic_arn.split(':')
              account = parts[4] if len(parts) > 5 else ''
              topic_name = parts[5] if len(parts) > 5 else ''

              if 'account-ids' in exp:
                  if account not in _as_list(exp['account-ids']):
                      return False, f'account {account} not in expected account-ids'
              if 'sns-topic-arn' in exp:
                  if topic_arn not in _as_list(exp['sns-topic-arn']):
                      return False, 'topic ARN does not match sns-topic-arn'
              if 'sns-topic-name' in exp:
                  if topic_name not in _as_list(exp['sns-topic-name']):
                      return False, 'topic name does not match sns-topic-name'
              if 'sns-topic-like' in exp:
                  if not any(fnmatch.fnmatchcase(topic_name, p) for p in _as_list(exp['sns-topic-like'])):
                      return False, 'topic name does not match sns-topic-like'
              return True, None


          def _content_ok(exp, subject, body):
              checks = [
                  ('subject-matches', lambda vs: subject in vs),
                  ('subject-like', lambda vs: any(fnmatch.fnmatchcase(subject, v) for v in vs)),
                  ('subject-contains-any', lambda vs: any(v in subject for v in vs)),
                  ('subject-contains-all', lambda vs: all(v in subject for v in vs)),
                  ('body-contains-any', lambda vs: any(v in body for v in vs)),
                  ('body-contains-all', lambda vs: all(v in body for v in vs)),
                  ('body-like-any', lambda vs: any(fnmatch.fnmatchcase(body, v) for v in vs)),
                  ('body-like-all', lambda vs: all(fnmatch.fnmatchcase(body, v) for v in vs)),
              ]
              for key, test in checks:
                  if key in exp and not test(_as_list(exp[key])):
                      return False, f'{key} not satisfied'
              return True, None


          def _as_list(value):
              return value if isinstance(value, list) else [value]


          # --- DynamoDB writes ---

          def _record(addr, kind, result, ttl, subject, body, detail=None, topicArn=None):
              """Append an immutable audit record: event = "<kind>#<epoch.micros>"."""
              now = time.time()
              item = {
                  'email': addr,
                  'event': f'{kind}#{now:.6f}',
                  'result': result,
                  'timestamp': Decimal(f'{now:.6f}'),
                  'subject': subject,
                  'body': (body or '')[:MAX_BODY],
              }
              if ttl is not None:
                  item['ttl'] = int(ttl)
              if detail is not None:
                  item['detail'] = detail
              if topicArn is not None:
                  item['topicArn'] = topicArn
              table.put_item(Item=item)


          def _unexpected(addr, sender, subject, result):
              """Record mail that should not have been acted on: alert to activity, not
              debug it. No body is read or stored. `result` is 'undefined' (failed the
              trust gate) or 'unregistered' (genuine confirmation for an unknown address).
              Uses the default ttl and expires independently."""
              now = time.time()
              table.put_item(Item={
                  'email': addr,
                  'event': f'unexpected#{now:.6f}',
                  'result': result,
                  'timestamp': Decimal(f'{now:.6f}'),
                  'sender': sender,
                  'subject': _clip(subject),
                  'ttl': int(now) + RECORD_TTL_SECONDS,
              })


          def _clip(subject):
              subject = subject or ''
              return subject[:MAX_UNEXPECTED_SUBJECT] + '...' if len(subject) > MAX_UNEXPECTED_SUBJECT else subject


          def _get_body(message_id):
              if not MAIL_BUCKET:
                  return ''
              try:
                  raw = s3.get_object(Bucket=MAIL_BUCKET, Key=message_id)['Body'].read().decode('utf-8', errors='replace')
                  msg = emaillib.message_from_string(raw)
                  if msg.is_multipart():
                      for part in msg.walk():
                          if part.get_content_type() in ('text/plain', 'text/html'):
                              payload = part.get_payload(decode=True)
                              if payload:
                                  return payload.decode('utf-8', errors='replace')
                  else:
                      payload = msg.get_payload(decode=True)
                      if payload:
                          return payload.decode('utf-8', errors='replace')
                  # No decodable text payload. Return empty rather than the raw MIME, so
                  # header content (e.g. Subject) never leaks into body checks.
                  return ''
              except Exception as e:
                  logger.error('S3 fetch %s failed: %s', message_id, e)
                  return ''


          def _registration(addr):
              # Exact PK+SK lookup (never more than one item / one page), but follow
              # pagination for consistency and defensiveness.
              kwargs = {'KeyConditionExpression': Key('email').eq(addr) & Key('event').eq('registration')}
              while True:
                  resp = table.query(**kwargs)
                  items = resp.get('Items', [])
                  if items:
                      return items[0]
                  start = resp.get('LastEvaluatedKey')
                  if not start:
                      return None
                  kwargs['ExclusiveStartKey'] = start


          def _first(seq):
              return seq[0] if seq else ''


          def _extract_email(value):
              # Lowercase to match the canonical PK the interface Lambda registers under;
              # otherwise a mixed-case address would silently miss its registration.
              match = re.search(r'[\w.+-]+@[\w.-]+', value or '')
              return (match.group(0) if match else (value or '')).lower()
  ProcessorSesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessorLambda
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # --- SES Inbound Mail ---
  MailReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: !Sub "${AWS::StackName}-mail-rules"

  MailReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - MailBucketPolicy
      - ProcessorSesPermission
    Properties:
      RuleSetName: !Ref MailReceiptRuleSet
      Rule:
        Name: !Sub "${AWS::StackName}-inbound"
        Enabled: true
        ScanEnabled: false
        # Require TLS on the sending SMTP connection into SES.
        TlsPolicy: Require
        Recipients:
          - !Ref EmailDomain
        Actions:
          - S3Action:
              BucketName: !Ref MailBucket
          - LambdaAction:
              FunctionArn: !GetAtt ProcessorLambda.Arn
              InvocationType: Event

Outputs:
  InterfaceLambdaName:
    Description: Name of the Interface Lambda (invoke target for consumers).
    Value: !Ref InterfaceLambda
